name: TicketFlow CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Tests & Build (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Unit & Concurrency Tests
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean test

      - name: Package JAR
        run: |
          cd backend
          ./mvnw package -DskipTests

  frontend-test:
    name: Frontend Lint & Build (React 19 / TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Type Check & Build
        run: |
          cd frontend
          npm run build

  terraform-validate:
    name: Terraform IaC Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format & Init Check
        run: |
          cd infra/terraform
          terraform fmt -check
          terraform init -backend=false
          terraform validate
