version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketflow-postgres
    environment:
      POSTGRES_DB: ticketflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ticketflow-network

  redis:
    image: redis:7-alpine
    container_name: ticketflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ticketflow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ticketflow-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ticketflow
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ticketflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticketflow-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ticketflow-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ticketflow-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - ticketflow-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ticketflow-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - ticketflow-network

volumes:
  postgres_data:

networks:
  ticketflow-network:
    driver: bridge

